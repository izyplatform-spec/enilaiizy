<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ujian Online · e-Nilai</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root { --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --primary:#2563eb; --ok:#16a34a; --danger:#dc2626; --border:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 6px; }
  input[type=text], textarea, select { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:15px; font-family:inherit; }
  textarea { min-height:90px; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 18px; cursor:pointer; background:#e2e8f0; color:var(--text); }
  button.primary { background:var(--primary); color:#fff; font-weight:600; }
  button.ok { background:var(--ok); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .err { color:var(--danger); font-size:13px; margin-top:10px; min-height:18px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .timer { font-variant-numeric: tabular-nums; font-weight:800; font-size:20px; padding:8px 14px; border-radius:10px; background:#eff6ff; color:var(--primary); }
  .timer.kritis { background:#fef2f2; color:var(--danger); }
  .nomor { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
  .nomor button { width:40px; height:40px; padding:0; }
  .nomor button.terjawab { background:#dcfce7; }
  .nomor button.aktif { outline:2px solid var(--primary); }
  .pilihan { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .pilihan input { margin-top:4px; }
  .jodoh-row { display:grid; grid-template-columns: 1fr 1fr; gap:8px; align-items:center; margin-bottom:8px; }
  .nav-bawah { display:flex; justify-content:space-between; gap:8px; margin-top:16px; }
  .gambar-soal { max-width:100%; height:auto; border-radius:8px; border:1px solid var(--border); margin:8px 0; }
  .katex-display { overflow-x:auto; }
  @media (max-width:560px) { .jodoh-row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== LOGIN ===== -->
  <div id="layarLogin" class="card" style="max-width:420px; margin: 40px auto;">
    <h1>📝 Ujian Online</h1>
    <p class="muted">Masukkan NISN dan token ujian dari guru Anda.</p>
    <label for="inNisn">NISN</label>
    <input type="text" id="inNisn" inputmode="numeric" autocomplete="off">
    <label for="inToken">Token ujian (PIN)</label>
    <input type="text" id="inToken" autocomplete="off" style="text-transform:uppercase; letter-spacing:2px; font-weight:700;">
    <div style="margin-top:16px;"><button class="primary" id="btnMasuk" style="width:100%;">Masuk ujian</button></div>
    <div class="err" id="errLogin"></div>
  </div>

  <!-- ===== UJIAN ===== -->
  <div id="layarUjian" style="display:none;">
    <div class="card">
      <div class="topbar">
        <div>
          <h1 id="judulUjian">-</h1>
          <div class="muted" id="infoUjian">-</div>
        </div>
        <div class="timer" id="timer">--:--</div>
      </div>
      <div class="muted">Peserta: <strong id="namaPeserta">-</strong> · Kelas <span id="kelasPeserta">-</span></div>
      <div class="nomor" id="navNomor"></div>
    </div>

    <div class="card">
      <div class="muted" id="infoSoal">Soal 1</div>
      <div id="areaSoal" style="margin-top:8px; font-size:16px; line-height:1.5;"></div>
      <div class="nav-bawah">
        <button id="btnPrev">← Sebelumnya</button>
        <button id="btnNext">Berikutnya →</button>
      </div>
    </div>

    <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
      <div class="muted" id="ringkasanJawaban">-</div>
      <button class="ok" id="btnSelesai">Selesai & kumpulkan</button>
    </div>
  </div>

  <!-- ===== SELESAI ===== -->
  <div id="layarSelesai" class="card" style="display:none; text-align:center; max-width:460px; margin: 40px auto;">
    <h1>✅ Ujian selesai</h1>
    <p class="muted" id="teksSelesai">Jawaban Anda sudah tersimpan.</p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
  import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, query, where, increment }
    from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

  // Konfigurasi sama dengan e-Nilai
  const firebaseConfig = {
    apiKey: "AIzaSyC_5sI9JYaR-bbGWBQFvfl2SX1xe2WRPuE",
    authDomain: "input-nilai-online-c4657.firebaseapp.com",
    projectId: "input-nilai-online-c4657",
    storageBucket: "input-nilai-online-c4657.firebasestorage.app",
    messagingSenderId: "676655325666",
    appId: "1:676655325666:web:0db190cedc613a165199bb",
    measurementId: "G-XYMHEHR27B"
  };
  const db = getFirestore(initializeApp(firebaseConfig));

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const TIPE = { PG:'Pilihan ganda', BS:'Benar / salah', ISIAN:'Isian singkat', JODOH:'Menjodohkan', URAIAN:'Uraian' };

  // Rumus: $...$ inline, $$...$$ blok. Bagian teks biasa di-escape.
  function math(teks) {
    const t = String(teks ?? '');
    if (typeof katex === 'undefined') return esc(t).replace(/\n/g, '<br>');
    return t.split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/).map(part => {
      try {
        if (part.startsWith('$$') && part.endsWith('$$') && part.length > 4)
          return katex.renderToString(part.slice(2, -2), { displayMode: true, throwOnError: false });
        if (part.startsWith('$') && part.endsWith('$') && part.length > 2)
          return katex.renderToString(part.slice(1, -1), { throwOnError: false });
      } catch (e) { /* jatuh ke teks biasa */ }
      return esc(part).replace(/\n/g, '<br>');
    }).join('');
  }

  let st = null; // state ujian

  const acak = arr => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const tampilErr = msg => { $('errLogin').textContent = msg; };

  // ---------- LOGIN ----------
  async function cariSantri(nisn) {
    let snap = await getDocs(query(collection(db, 'santri'), where('nisn', '==', nisn)));
    if (snap.empty && /^\d+$/.test(nisn)) snap = await getDocs(query(collection(db, 'santri'), where('nisn', '==', Number(nisn))));
    if (snap.empty) return null;
    const d = snap.docs[0];
    return { id: d.id, ...d.data(), nama: d.data().namaSantri || d.data().name || '-' };
  }

  async function cariPaket(token, kelas) {
    const snap = await getDocs(query(collection(db, 'cbtPaket'), where('token', '==', token)));
    const now = Date.now();
    return snap.docs.map(d => ({ id: d.id, ...d.data() })).find(p =>
      p.status === 'AKTIF' && String(p.kelas) === String(kelas) &&
      now >= new Date(p.mulaiAt).getTime() && now <= new Date(p.selesaiAt).getTime()) || null;
  }

  $('btnMasuk').onclick = async () => {
    tampilErr('');
    const nisn = $('inNisn').value.trim();
    const token = $('inToken').value.trim().toUpperCase();
    if (!nisn || !token) return tampilErr('NISN dan token wajib diisi.');
    $('btnMasuk').disabled = true;
    try {
      const santri = await cariSantri(nisn);
      if (!santri) return tampilErr('NISN tidak ditemukan. Hubungi guru atau admin.');
      const paket = await cariPaket(token, santri.kelas);
      if (!paket) return tampilErr('Token tidak valid, belum dibuka, atau sudah berakhir untuk kelas Anda.');
      if (paket.induk) {
        // Susulan hanya untuk santri yang belum menyelesaikan ujian utamanya
        const utama = await getDoc(doc(db, 'cbtSesi', `${paket.induk}__${santri.id}`));
        if (utama.exists() && utama.data().status === 'SELESAI')
          return tampilErr('Anda sudah mengerjakan ujian utama. Ujian susulan tidak berlaku.');
      }
      await mulaiAtauLanjut(santri, paket);
    } catch (e) {
      tampilErr('Gagal terhubung: ' + e.message);
    } finally {
      $('btnMasuk').disabled = false;
    }
  };

  // ---------- SESI ----------
  // Membuat sesi baru: soal & opsi diacak sesuai paket. kesempatan = nomor pengerjaan (1 = pertama).
  async function buatSesi(santri, paket, kesempatan) {
    const soalList = [];
    for (const id of paket.soalIds || []) {
      const s = await getDoc(doc(db, 'cbtSoal', id));
      if (s.exists()) soalList.push({ id: s.id, ...s.data() });
    }
    const urutan = paket.acakSoal ? acak(soalList.map(s => s.id)) : soalList.map(s => s.id);
    const opsiUrut = {};
    soalList.forEach(s => {
      const n = s.tipe === 'PG' ? (s.opsi || []).length : s.tipe === 'JODOH' ? (s.pasangan || []).length : 0;
      if (n) {
        const idx = [...Array(n).keys()];
        opsiUrut[s.id] = paket.acakOpsi ? acak(idx) : idx;
      }
    });
    const sesi = {
      paketId: paket.id, santriId: santri.id, santriName: santri.nama, nisn: String(santri.nisn || ''),
      kelas: String(santri.kelas || ''), status: 'BERJALAN', mulaiMs: Date.now(), kesempatan,
      urutanSoal: urutan, opsiUrut, jawaban: {}, skorSoal: {}, nilaiUraian: {}, pindahTab: 0
    };
    await setDoc(doc(db, 'cbtSesi', `${paket.id}__${santri.id}`), sesi);
    return sesi;
  }

  async function mulaiAtauLanjut(santri, paket) {
    const sesiRef = doc(db, 'cbtSesi', `${paket.id}__${santri.id}`);
    const lama = await getDoc(sesiRef);
    let sesi;
    if (lama.exists() && lama.data().status === 'SELESAI') {
      return tampilErr('Anda sudah menyelesaikan ujian ini.');
    } else if (lama.exists() && lama.data().status === 'BERJALAN') {
      sesi = lama.data();                       // lanjutkan: waktu tetap dari mulaiMs
    } else {
      // Belum pernah mulai, atau dibuka ulang oleh guru
      const kesempatan = lama.exists() ? (lama.data().kesempatan || 1) + 1 : 1;
      sesi = await buatSesi(santri, paket, kesempatan);
    }
    const soalMap = new Map();
    for (const id of sesi.urutanSoal || paket.soalIds || []) {
      const s = await getDoc(doc(db, 'cbtSoal', id));
      if (s.exists()) soalMap.set(id, { id: s.id, ...s.data() });
    }
    const batasWaktu = Math.min(sesi.mulaiMs + paket.durasiMenit * 60000, new Date(paket.selesaiAt).getTime());
    st = { sesiRef, sesi, paket, santri, soal: soalMap, urutan: sesi.urutanSoal || [...soalMap.keys()], idx: 0, deadlineMs: batasWaktu, timerId: null };
    tampilUjian();
  }

  // ---------- TAMPILAN UJIAN ----------
  function tampilUjian() {
    $('layarLogin').style.display = 'none';
    $('layarUjian').style.display = 'block';
    $('judulUjian').textContent = st.paket.nama;
    $('infoUjian').textContent = `${st.paket.mapelName || ''} · Durasi ${st.paket.durasiMenit} menit`;
    $('namaPeserta').textContent = st.santri.nama;
    $('kelasPeserta').textContent = st.sesi.kelas;
    tampilSoal();
    jalankanTimer();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && st && st.sesi.status === 'BERJALAN') {
        updateDoc(st.sesiRef, { pindahTab: increment(1) }).catch(() => {});
      }
    });
  }

  function buatNavNomor() {
    $('navNomor').innerHTML = st.urutan.map((id, i) =>
      `<button data-i="${i}" class="${i === st.idx ? 'aktif ' : ''}${sudahJawab(id) ? 'terjawab' : ''}">${i + 1}</button>`).join('');
    $('navNomor').onclick = e => {
      const b = e.target.closest('button[data-i]');
      if (b) { st.idx = Number(b.dataset.i); tampilSoal(); }
    };
  }

  function sudahJawab(id) {
    const v = st.sesi.jawaban?.[id];
    if (v === undefined || v === null || v === '') return false;
    if (typeof v === 'object') return Object.keys(v).length > 0;
    return true;
  }

  function tampilSoal() {
    const id = st.urutan[st.idx];
    const s = st.soal.get(id);
    if (!s) return;
    $('infoSoal').textContent = `Soal ${st.idx + 1} dari ${st.urutan.length} · ${TIPE[s.tipe] || s.tipe} · bobot ${s.bobot ?? 1}`;
    const jw = st.sesi.jawaban?.[id];
    const opsiUrut = st.sesi.opsiUrut?.[id];
    let isi = `<div style="margin-bottom:12px;">${math(s.pertanyaan)}</div>`;
    if (s.gambar) isi += `<img class="gambar-soal" src="${s.gambar}" alt="Gambar soal">`;

    if (s.tipe === 'PG') {
      const urut = opsiUrut || s.opsi.map((_, i) => i);
      isi += urut.map((asli, k) => `
        <label class="pilihan">
          <input type="radio" name="jawab" value="${asli}" ${jw === asli ? 'checked' : ''}>
          <span><strong>${'ABCDE'[k]}.</strong> ${math(s.opsi[asli])}</span>
        </label>`).join('');
    } else if (s.tipe === 'BS') {
      isi += ['B', 'S'].map(v => `
        <label class="pilihan"><input type="radio" name="jawab" value="${v}" ${jw === v ? 'checked' : ''}>
          <span>${v === 'B' ? 'Benar' : 'Salah'}</span></label>`).join('');
    } else if (s.tipe === 'ISIAN') {
      isi += `<input type="text" id="isianInput" value="${esc(jw || '')}" placeholder="Tulis jawaban Anda">`;
    } else if (s.tipe === 'JODOH') {
      const kanan = opsiUrut || s.pasangan.map((_, i) => i);
      isi += s.pasangan.map((p, i) => `
        <div class="jodoh-row">
          <div>${math(p.kiri)}</div>
          <select data-jodoh="${i}">
            <option value="">— pilih pasangan —</option>
            ${kanan.map(asli => `<option value="${asli}" ${jw?.[i] === asli ? 'selected' : ''}>${esc(s.pasangan[asli].kanan)}</option>`).join('')}
          </select>
        </div>`).join('');
    } else {
      isi += `<textarea id="uraianInput" placeholder="Tulis jawaban Anda">${esc(jw || '')}</textarea>`;
    }
    $('areaSoal').innerHTML = isi;
    $('btnPrev').disabled = st.idx === 0;
    $('btnNext').disabled = st.idx === st.urutan.length - 1;
    buatNavNomor();
    ringkasan();
    pasangInput(id, s);
  }

  function pasangInput(id, s) {
    const simpan = val => {
      st.sesi.jawaban = { ...(st.sesi.jawaban || {}), [id]: val };
      updateDoc(st.sesiRef, { [`jawaban.${id}`]: val }).catch(e => console.error(e));
      buatNavNomor();
      ringkasan();
    };
    const area = $('areaSoal');
    if (s.tipe === 'PG' || s.tipe === 'BS') {
      area.querySelectorAll('input[name="jawab"]').forEach(r => r.onchange = () => {
        simpan(s.tipe === 'PG' ? Number(r.value) : r.value);
      });
    } else if (s.tipe === 'ISIAN') {
      $('isianInput').oninput = e => simpan(e.target.value);
    } else if (s.tipe === 'URAIAN') {
      $('uraianInput').oninput = e => simpan(e.target.value);
    } else if (s.tipe === 'JODOH') {
      area.querySelectorAll('select[data-jodoh]').forEach(sel => sel.onchange = () => {
        const cur = { ...(st.sesi.jawaban?.[id] || {}) };
        if (sel.value === '') delete cur[sel.dataset.jodoh]; else cur[sel.dataset.jodoh] = Number(sel.value);
        simpan(cur);
      });
    }
  }

  function ringkasan() {
    const n = st.urutan.filter(id => sudahJawab(id)).length;
    $('ringkasanJawaban').textContent = `Terjawab ${n} dari ${st.urutan.length} soal`;
    buatNavNomor();
  }

  $('btnPrev').onclick = () => { if (st.idx > 0) { st.idx--; tampilSoal(); } };
  $('btnNext').onclick = () => { if (st.idx < st.urutan.length - 1) { st.idx++; tampilSoal(); } };
  $('btnSelesai').onclick = () => {
    const kosong = st.urutan.length - st.urutan.filter(id => sudahJawab(id)).length;
    const pesan = kosong > 0 ? `Masih ada ${kosong} soal belum dijawab. ` : '';
    if (confirm(pesan + 'Kumpulkan jawaban sekarang? Jawaban tidak bisa diubah lagi.')) kumpulkan(false);
  };

  // ---------- TIMER ----------
  function jalankanTimer() {
    const tick = () => {
      const sisa = Math.max(0, st.deadlineMs - Date.now());
      const m = Math.floor(sisa / 60000), d = Math.floor((sisa % 60000) / 1000);
      $('timer').textContent = `${String(m).padStart(2, '0')}:${String(d).padStart(2, '0')}`;
      $('timer').classList.toggle('kritis', sisa <= 5 * 60000);
      if (sisa <= 0) { clearInterval(st.timerId); kumpulkan(true); }
    };
    tick();
    st.timerId = setInterval(tick, 1000);
  }

  // ---------- PENILAIAN OBJEKTIF & KUMPUL ----------
  function skorSoalObjektif(s, jw) {
    if (s.tipe === 'PG' || s.tipe === 'BS') return jw === s.kunci ? 1 : 0;
    if (s.tipe === 'ISIAN') {
      const benar = String(s.kunci || '').split('|').map(x => x.trim().toLowerCase());
      return benar.includes(String(jw || '').trim().toLowerCase()) ? 1 : 0;
    }
    if (s.tipe === 'JODOH') {
      const n = s.pasangan.length || 1;
      let ok = 0;
      s.pasangan.forEach((_, i) => { if (jw?.[i] === i) ok++; });
      return ok / n;
    }
    return null; // uraian: dinilai guru
  }

  async function kumpulkan(otomatis) {
    if (!st || st.sesi.status === 'SELESAI') return;
    clearInterval(st.timerId);
    const skorSoal = {};
    let objBobot = 0, objDapat = 0;
    st.urutan.forEach(id => {
      const s = st.soal.get(id);
      if (!s) return;
      const f = skorSoalObjektif(s, st.sesi.jawaban?.[id]);
      if (f === null) return;
      skorSoal[id] = f;
      const b = Number(s.bobot) || 1;
      objBobot += b;
      objDapat += b * f;
    });
    const skorObjektif = objBobot > 0 ? Math.round((objDapat / objBobot) * 10000) / 100 : 0;
    try {
      await updateDoc(st.sesiRef, { status: 'SELESAI', selesaiMs: Date.now(), skorSoal, skorObjektif, dikumpulkanOtomatis: otomatis });
      st.sesi.status = 'SELESAI';
      $('layarUjian').style.display = 'none';
      $('layarSelesai').style.display = 'block';
      const adaUraian = st.urutan.some(id => st.soal.get(id)?.tipe === 'URAIAN');
      $('teksSelesai').textContent = (otomatis ? 'Waktu ujian habis, jawaban Anda dikumpulkan otomatis. ' : 'Jawaban Anda sudah tersimpan. ')
        + (adaUraian ? 'Soal uraian akan dinilai oleh guru.' : '');
    } catch (e) {
      alert('Gagal mengumpulkan: ' + e.message + '. Coba lagi.');
      jalankanTimer();
    }
  }

  window.addEventListener('beforeunload', e => {
    if (st && st.sesi.status === 'BERJALAN') { e.preventDefault(); e.returnValue = ''; }
  });
</script>
</body>
</html>
